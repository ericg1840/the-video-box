<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Video Box</title>
  <meta name="description" content="Shuffle through random YouTube music videos.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📼 The Video Box</h1>
    <p class="tagline">Random music videos, one after another.</p>
  </header>

  <main>
    <section class="stage">
      <div class="player-frame">
        <div id="player"></div>
        <div id="splash" class="splash">
          <button id="start" class="big-btn">▶ Start the shuffle</button>
        </div>
      </div>

      <div class="now-playing">
        <div>
          <div id="np-title" class="np-title">Nothing playing yet</div>
          <div id="np-artist" class="np-artist"></div>
        </div>
        <span id="np-genre" class="chip" hidden></span>
      </div>

      <div class="controls">
        <button id="prev" title="Previous (P)">⏮ Prev</button>
        <button id="toggle" title="Play / pause (Space)">⏯ Pause</button>
        <button id="next" class="primary" title="Shuffle to next (N)">🔀 Next</button>
        <label class="genre">
          Genre
          <select id="genre-filter"><option value="all">All</option></select>
        </label>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <aside>
      <h2>Recently played</h2>
      <ol id="history" class="history"></ol>

      <h2>Add your own</h2>
      <form id="add-form" class="add-form">
        <input id="add-input" type="text" placeholder="YouTube URL or video ID" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul id="custom-list" class="custom-list"></ul>
    </aside>
  </main>

  <footer>Keyboard: <kbd>N</kbd> next · <kbd>P</kbd> previous · <kbd>Space</kbd> play/pause</footer>

  <script src="videos.js"></script>
  <script src="app.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
